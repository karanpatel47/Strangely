# Minimal coturn config for local development / small deployments.
# In production, replace static-auth-secret with a proper TURN REST API
# secret and set realm to your real domain.

listening-port=3478
tls-listening-port=5349

# Range used for relayed media - must be opened on the host/container too.
min-port=49160
max-port=49200

fingerprint
lt-cred-mech

# Simple static username/password for Phase 1 (matches TURN_USERNAME/TURN_PASSWORD
# env vars passed to the backend, which hands them to the frontend via /api/config/ice-servers).
user=strangerchat:strangerchat_turn_secret

realm=strangerchat.local

# Disable open relay to arbitrary destinations / loopback for basic hardening.
no-loopback-peers
no-multicast-peers

log-file=stdout
verbose
