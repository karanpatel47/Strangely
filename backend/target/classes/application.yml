server:
  port: ${PORT:8080}

spring:
  application:
    name: stranger-chat-backend

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:default}
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: ${REDIS_SSL:true}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

  webrtc:
    stun-server: ${STUN_SERVER:stun:stun.l.google.com:19302}
    turn-server: ${TURN_SERVER:}
    turn-username: ${TURN_USERNAME:}
    turn-password: ${TURN_PASSWORD:}

  chat:
    max-message-length: 1000

  matchmaking:
    stale-waiting-seconds: 120
    presence-ttl-seconds: 30

logging:
  level:
    com.strangerchat: INFO