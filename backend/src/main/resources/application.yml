server:
  port: 8080

spring:
  application:
    name: stranger-chat-backend

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/strangerchat}
    username: ${DATABASE_USERNAME:strangerchat}
    password: ${DATABASE_PASSWORD:strangerchat}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  webrtc:
    stun-server: ${STUN_SERVER:stun:stun.l.google.com:19302}
    turn-server: ${TURN_SERVER:}
    turn-username: ${TURN_USERNAME:}
    turn-password: ${TURN_PASSWORD:}
  chat:
    max-message-length: 1000
  matchmaking:
    stale-waiting-seconds: 120
    presence-ttl-seconds: 30

logging:
  level:
    com.strangerchat: INFO
