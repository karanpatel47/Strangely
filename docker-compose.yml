services:
  postgres:
    image: postgres:16-alpine
    container_name: strangerchat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-strangerchat}
      POSTGRES_USER: ${POSTGRES_USER:-strangerchat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-strangerchat}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: strangerchat-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  coturn:
    image: coturn/coturn:4.6
    container_name: strangerchat-coturn
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./infra/coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    command: ["-c", "/etc/coturn/turnserver.conf"]

  backend:
    build:
      context: ./backend
    container_name: strangerchat-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-jdbc:postgresql://postgres:5432/strangerchat}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-strangerchat}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-change_me_in_production}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_SSL: ${REDIS_SSL:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      STUN_SERVER: ${STUN_SERVER:-stun:stun.l.google.com:19302}
      TURN_SERVER: ${TURN_SERVER:-turn:localhost:3478}
      TURN_USERNAME: ${TURN_USERNAME:-strangerchat}
      TURN_PASSWORD: ${TURN_PASSWORD:-strangerchat_turn_secret}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_WS_URL: ${VITE_WS_URL:-http://localhost:8080/ws}
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080/api}
    container_name: strangerchat-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:
